    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        .card{
            width: 320px;
            height: 420px;
            border-radius: 20px;
            background-color: aquamarine;
            overflow: hidden;
            
        }
        .card img{
            width: 100%;
            height: 100%;
        }
        .card:hover .card-content{
            transform: translateY(-420px);
        }
        .card-content{
            background-color: rgb(85, 84, 84);
            color: rgb(6, 5, 5);
            transition-duration: 2s;
            height: 420px;
            opacity: 0.7;
        }
    </style>
</head>
